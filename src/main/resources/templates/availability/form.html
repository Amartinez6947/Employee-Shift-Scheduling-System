<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee Availability</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        header {
            background: #263b50;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 650px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd3da;
            border-radius: 6px;
            background: white;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #2878a5;
            border-color: #2878a5;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #2878a5;
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .button:hover {
            background: #1d5f83;
        }

        .cancel-button {
            background: #687782;
        }

        .cancel-button:hover {
            background: #4c5b65;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            background: #fbe7e7;
            color: #922c2c;
        }

        @media (max-width: 650px) {
            main {
                margin: 20px;
                padding: 22px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Shift Scheduling</h1>
</header>

<main>

    <h2>Add Employee Availability</h2>

    <p>Choose an employee and enter their available working hours.</p>

    <div th:if="${errorMessage}"
         class="message"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/availability}" method="post">

        <div class="form-group">
            <label for="employeeID">Employee</label>

            <select id="employeeID" name="employeeID" required>

                <option value="">Select an employee</option>

                <option th:each="employee : ${employees}"
                        th:value="${employee.employeeID}"
                        th:text="${employee.firstName + ' ' + employee.lastName}">
                </option>

            </select>
        </div>

        <div class="form-group">
            <label for="dayOfWeek">Day of Week</label>

            <select id="dayOfWeek" name="dayOfWeek" required>
                <option value="">Select a day</option>
                <option value="MONDAY">Monday</option>
                <option value="TUESDAY">Tuesday</option>
                <option value="WEDNESDAY">Wednesday</option>
                <option value="THURSDAY">Thursday</option>
                <option value="FRIDAY">Friday</option>
                <option value="SATURDAY">Saturday</option>
                <option value="SUNDAY">Sunday</option>
            </select>
        </div>

        <div class="form-group">
            <label for="startTime">Available Start Time</label>

            <input type="time"
                   id="startTime"
                   name="startTime"
                   required>
        </div>

        <div class="form-group">
            <label for="endTime">Available End Time</label>

            <input type="time"
                   id="endTime"
                   name="endTime"
                   required>
        </div>

        <div class="actions">

            <button type="submit" class="button">
                Save Availability
            </button>

            <a th:href="@{/availability}"
               class="button cancel-button">
                Cancel
            </a>

        </div>

    </form>

</main>

</body>
</html>
