
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        header {
            background: #263b50;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0;
        }

        .top-navigation {
            background: white;
            padding: 15px 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #dce2e8;
        }

        .top-navigation a {
            color: #263b50;
            text-decoration: none;
            font-weight: bold;
            padding: 9px 13px;
            border-radius: 5px;
        }

        .top-navigation a:hover {
            background: #edf2f6;
        }

        .top-navigation .dashboard-link {
            background: #263b50;
            color: white;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 6px;
            background: #2878a5;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background: #1d5f83;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e3e8ed;
        }

        th {
            background: #edf2f6;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .delete-button {
            background: #b83b3b;
        }

        .delete-button:hover {
            background: #922c2c;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #687782;
        }

        @media (max-width: 650px) {
            main {
                margin: 20px;
                padding: 15px;
                overflow-x: auto;
            }

            header {
                padding: 20px;
            }

            .top-navigation {
                padding: 12px 20px;
            }

            .page-heading {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Shift Scheduling</h1>
</header>

<nav class="top-navigation">
    <a class="dashboard-link" th:href="@{/}">Dashboard</a>
    <a th:href="@{/schedule}">Weekly Calendar</a>
    <a th:href="@{/employees}">Employees</a>
    <a th:href="@{/shifts}">Shift Management</a>
    <a th:href="@{/availability}">Employee Availability</a>
</nav>

<main>

    <div class="page-heading">
        <div>
            <h2>Employee Management</h2>
            <p>View and manage your employees.</p>
        </div>

        <a th:href="@{/employees/new}" class="button">
            + Add Employee
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Employee ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.employeeID}"></td>
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>

            <td>
                <div class="actions">
                    <a th:href="@{/employees/edit/{id}(id=${employee.employeeID})}"
                       class="button">
                        Edit
                    </a>

                    <form th:action="@{/employees/delete/{id}(id=${employee.employeeID})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this employee?');">

                        <button type="submit" class="button delete-button">
                            Delete
                        </button>
                    </form>
                </div>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="4" class="empty-message">
                No employees have been added yet.
            </td>
        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
