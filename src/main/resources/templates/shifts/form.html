<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee Shift</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        header {
            background: #263b50;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0;
        }

        .top-navigation {
            background: white;
            padding: 15px 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #dce2e8;
        }

        .top-navigation a {
            color: #263b50;
            text-decoration: none;
            font-weight: bold;
            padding: 9px 13px;
            border-radius: 5px;
        }

        .top-navigation a:hover {
            background: #edf2f6;
        }

        .top-navigation .dashboard-link {
            background: #263b50;
            color: white;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 20px 0 8px;
        }

        select, input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5df;
            border-radius: 6px;
            font-size: 15px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #287da8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 25px;
        }

        .cancel {
            background: #687782;
            margin-left: 8px;
        }

        .message {
            padding: 13px;
            margin: 15px 0;
            border-radius: 6px;
            background: #fde7e7;
            color: #b52d2d;
        }

        @media (max-width: 650px) {
            main {
                margin: 20px 12px;
                padding: 22px;
            }

            header {
                padding: 22px;
            }

            .top-navigation {
                padding: 12px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Shift Scheduling</h1>
</header>

<nav class="top-navigation">
    <a class="dashboard-link" th:href="@{/}">Dashboard</a>
    <a th:href="@{/schedule}">Weekly Calendar</a>
    <a th:href="@{/employees}">Employees</a>
    <a th:href="@{/shifts}">Shift Management</a>
    <a th:href="@{/availability}">Employee Availability</a>
</nav>

<main>

    <h2>Add Employee Shift</h2>

    <p>Select an employee and enter the scheduled shift details.</p>

    <div th:if="${errorMessage}"
         class="message"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/shifts}" method="post">

        <label for="employeeID">Employee</label>

        <select id="employeeID" name="employeeID" required>

            <option value="">Select an employee</option>

            <option th:each="employee : ${employees}"
                    th:value="${employee.employeeID}"
                    th:text="${employee.firstName + ' ' + employee.lastName}">
            </option>

        </select>

        <label for="date">Shift Date</label>

        <input type="date"
               id="date"
               name="date"
               required>

        <label for="startTime">Start Time</label>

        <input type="time"
               id="startTime"
               name="startTime"
               required>

        <label for="endTime">End Time</label>

        <input type="time"
               id="endTime"
               name="endTime"
               required>

        <button type="submit" class="button">
            Save Shift
        </button>

        <a th:href="@{/shifts}" class="button cancel">
            Cancel
        </a>

    </form>

</main>

</body>
</html>
